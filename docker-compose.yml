services:
  app-mobile-mysql:
    image: mysql:8.1.0
    container_name: app-mobile-mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecom}
      TZ: Asia/Ho_Chi_Minh
    command: --default-time-zone='+07:00' --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - app-mobile-mysql-data:/var/lib/mysql
      - ./be/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    networks:
      - july-mobile

  app-mobile-phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: app-mobile-phpmyadmin
    environment:
      PMA_HOST: app-mobile-mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${PHPMYADMIN_PORT:-8081}:80"
    depends_on:
      - app-mobile-mysql
    networks:
      - july-mobile

  app-mobile:
    build:
      context: ./be
      dockerfile: Dockerfile
    container_name: app-mobile
    restart: unless-stopped
    depends_on:
      app-mobile-mysql:
        condition: service_healthy
    ports:
      - "9100:9100"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
      - snort-logs:/var/log/snort
    networks:
      - july-mobile

  # cloudflare-mobile:
